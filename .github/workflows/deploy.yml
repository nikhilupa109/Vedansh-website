name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["react-redesign-v2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Show build output
        run: |
          echo "Working directory: $(pwd)"
          echo "Root contents:"
          ls -la
          echo "Check ./dist:"
          if [ -d "./dist" ]; then ls -la ./dist; else echo "./dist not present"; fi
          echo "Check ./build:"
          if [ -d "./build" ]; then ls -la ./build; else echo "./build not present"; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            ./dist
            ./build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
