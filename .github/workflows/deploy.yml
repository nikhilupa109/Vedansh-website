name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["react-redesign-v2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            vedansh-infra-react/package-lock.json

      - name: Detect project folder
        id: project
        run: |
          set -e
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f vedansh-infra-react/package.json ]; then
            echo "dir=vedansh-infra-react" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "❌ No package.json found in repo root or vedansh-infra-react/"
          ls -la
          exit 1

      - name: Install dependencies
        run: |
          cd "${{ steps.project.outputs.dir }}"
          npm ci --legacy-peer-deps

      - name: Build
        run: |
          cd "${{ steps.project.outputs.dir }}"
          npm run build

      - name: Detect build output folder
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"
          for d in dist docs build; do
            if [ -d "$d" ]; then
              echo "BUILD_PATH=${{ steps.project.outputs.dir }}/$d" >> "$GITHUB_ENV"
              echo "✅ Using build output: $d"
              exit 0
            fi
          done
          echo "❌ No build output folder found (dist/docs/build). Listing project folder:"
          ls -la
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
