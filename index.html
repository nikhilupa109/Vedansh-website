<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vedansh Infra Services</title>
    <meta name="description" content="Vedansh Infra Services delivers EPC, plant erection, and project management services across India's industrial sectors." />
    <script>
      // Restore path from 404.html redirect before React mounts
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          if (redirect !== location.href) {
            var url = new URL(redirect);
            history.replaceState(null, null, url.pathname + url.search + url.hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
